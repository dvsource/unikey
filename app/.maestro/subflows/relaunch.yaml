# Kill Expo Go and reopen the project WITHOUT wiping data (persistence checks).
appId: host.exp.exponent
---
- stopApp
# openLink alone doesn't bring a stopped Expo Go to the front; start it first.
- launchApp:
    stopApp: false
- openLink: ${APP_URL}
- extendedWaitUntil:
    visible: "Go home"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: "Go home"
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: "start-today"
    timeout: 60000
