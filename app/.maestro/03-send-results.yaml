# Cases: EXP-01
appId: host.exp.exponent
name: "Export: Send results opens the share sheet"
tags:
  - smoke
  - full
env:
  APP_URL: exp://127.0.0.1:8081?__expo_disable_onboarding=1&__expo_disable_fab=1
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: "start-today"
- runFlow: subflows/mark-ok.yaml
- tapOn:
    id: "close-session"
- tapOn:
    id: "tab-progress"
- assertVisible:
    id: "progress-reviewed"
    text: "Reviewed 1 of 241"
- tapOn:
    id: "send-results"
- extendedWaitUntil:
    notVisible:
      id: "send-results"
    timeout: 15000
- assertVisible: ".*unikey-review-maestro-reviewer.*\\.json"
- takeScreenshot: share-sheet
- back
