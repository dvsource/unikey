# Cases: PER-01, PER-02
appId: host.exp.exponent
name: "Persistence: marks and settings survive a restart"
tags:
  - smoke
  - full
env:
  APP_URL: exp://127.0.0.1:8081?__expo_disable_onboarding=1&__expo_disable_fab=1
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: "tab-progress"
# The switches sit below the fold, under the floating tab bar: centre one first.
- scrollUntilVisible:
    element:
      id: "toggle-show-english"
    direction: DOWN
    timeout: 45000
    centerElement: true
- tapOn:
    id: "toggle-show-english"
- tapOn:
    id: "tab-index"
- tapOn:
    id: "start-today"
- runFlow: subflows/mark-ok.yaml
- tapOn:
    id: "close-session"
- runFlow: subflows/relaunch.yaml
- assertVisible:
    id: "reviewed-count"
    text: "Reviewed 1 of 91"
- tapOn:
    id: "start-today"
- assertVisible: "Reviewed · OK"
- assertVisible: "Forces A and B act at one point.*"
- tapOn:
    id: "close-session"
- tapOn:
    id: "tab-progress"
- assertVisible: "Maestro Reviewer"
