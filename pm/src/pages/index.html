<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniKey Workbench</title>
<link rel="stylesheet" href="/site.css">
<style>
main { max-width: 760px; margin: 0 auto; padding: 18px 16px 40px; }
h1 { font-size: 20px; font-weight: 600; margin: 14px 0 4px; }
p { color: var(--muted); margin: 0 0 16px; }
.pages { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.pg { display: block; background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; padding: 14px 16px; color: var(--ink); text-decoration: none; }
.pg:hover { border-color: var(--lavender); }
.pg b { display: block; font-size: 15px; margin-bottom: 4px; }
.pg span { color: var(--muted); }
</style>
</head>
<body>
<main>
<!--site-nav-->
<h1>UniKey workbench</h1>
<p>Local tools for the project. Nothing here is hosted; it runs on this machine only.</p>
<div class="pages"><!--pages--></div>
</main>
</body>
</html>
