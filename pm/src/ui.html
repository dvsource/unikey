<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniKey Tracker</title>
<style>
/* Dawn tokens (app/src/theme.ts) */
:root {
  --skyTop:#E3ECFB; --skyMid:#F4F2F2; --skyBottom:#FDEAD6;
  --ink:#1B1F4B; --muted:#555A80; --faint:#B4BAD3; --surface:#FFFFFF; --hairline:#D8DFEF; --track:#E3E8F6;
  --yellow:#F6C453; --yellowEdge:#D49A1E; --lavender:#7569D6; --green:#23694D; --greenSoft:#DDF1E6;
  --terracotta:#C4693F; --terracottaSoft:#F8E4DA; --hold:#8C90AE;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 13px/1.4 "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
  background: linear-gradient(180deg, var(--skyTop), var(--skyMid) 45%, var(--skyBottom)) fixed; min-height: 100vh; }
header { position: sticky; top: 0; z-index: 5; background: rgba(244,242,242,.92); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--hairline); padding: 10px 16px 8px; }
h1 { font-size: 16px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
.live.on { background: var(--green); }
.sub { color: var(--muted); font-weight: 400; font-size: 12px; }
nav { display: flex; gap: 4px; margin: 8px 0 6px; flex-wrap: wrap; }
nav button, .chip { border: 1px solid var(--hairline); background: var(--surface); color: var(--ink); border-radius: 999px;
  padding: 4px 12px; font: inherit; cursor: pointer; }
nav button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters select, .filters input { font: inherit; border: 1px solid var(--hairline); border-radius: 10px; background: var(--surface);
  padding: 4px 8px; color: var(--ink); max-width: 180px; }
.filters label { color: var(--muted); font-size: 12px; display: flex; gap: 4px; align-items: center; }
main { padding: 14px 16px 40px; }
.view { display: none; } .view.on { display: block; }
.card, .panel { background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; }
.muted { color: var(--muted); } .small { font-size: 11px; }
.id { font: 600 11px ui-monospace, Menlo, monospace; color: var(--muted); }
.pri { font: 600 10px ui-monospace, monospace; border-radius: 6px; padding: 0 4px; background: var(--track); color: var(--muted); }
.pri.p0 { background: var(--terracotta); color: #fff; } .pri.p1 { background: var(--yellow); color: var(--ink); }
.st { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.st-td { background: var(--faint); } .st-ip { background: var(--yellow); } .st-bl { background: var(--terracotta); }
.st-oh { background: var(--hold); } .st-dn { background: var(--green); } .st-dr { background: #ddd; }
.tag { font-size: 10px; color: var(--lavender); }
.bar { height: 7px; background: var(--track); border-radius: 7px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--lavender); border-radius: 7px; }
.late { color: var(--terracotta); font-weight: 600; }
a { color: var(--lavender); }
/* overview */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { padding: 10px 14px; } .kpi b { display: block; font-size: 22px; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.proj { padding: 12px 14px; cursor: pointer; } .proj h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-top: 14px; }
.panel { padding: 12px 14px; } .panel h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
.li { padding: 4px 0; border-top: 1px solid var(--track); cursor: pointer; display: flex; gap: 6px; align-items: baseline; }
.li:first-of-type { border-top: 0; }
.li .t { flex: 1; min-width: 0; }
/* kanban */
.lane { margin-bottom: 16px; } .lane > h2 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.col { background: rgba(255,255,255,.45); border: 1px solid var(--hairline); border-radius: 16px; padding: 8px; min-height: 60px; }
.col > h3 { margin: 0 0 6px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.kc { padding: 8px 10px; margin-bottom: 6px; cursor: pointer; border-radius: 12px; }
.kc:hover { border-color: var(--lavender); }
.kc .t { margin: 2px 0; } .kc .why { font-size: 11px; color: var(--muted); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .kc .meta { font-size: 11px; color: var(--muted); }
.kc.blk { border-left: 3px solid var(--terracotta); }
.kids { margin-top: 4px; font-size: 11px; }
.kids div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
/* graph */
#graphWrap { position: relative; height: calc(100vh - 150px); min-height: 420px; }
#graph { width: 100%; height: 100%; display: block; border-radius: 16px; background: rgba(255,255,255,.5); border: 1px solid var(--hairline); }
.legend { position: absolute; left: 10px; bottom: 10px; font-size: 11px; background: rgba(255,255,255,.85); border-radius: 10px; padding: 6px 10px; }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; margin: 0 4px 3px 8px; vertical-align: middle; }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: #fff; padding: 4px 8px; border-radius: 8px; font-size: 12px; display: none; max-width: 320px; z-index: 20; }
/* gantt */
#gantt { overflow: auto; max-height: calc(100vh - 150px); background: rgba(255,255,255,.5); border: 1px solid var(--hairline); border-radius: 16px; }
#gantt svg text { font-size: 11px; fill: var(--ink); }
/* detail */
#detail { position: fixed; right: 0; top: 0; bottom: 0; width: min(420px, 100%); background: var(--surface); border-left: 1px solid var(--hairline);
  box-shadow: -8px 0 30px rgba(27,31,75,.12); padding: 16px; overflow-y: auto; z-index: 30; display: none; }
#detail.on { display: block; }
#detail h2 { font-size: 15px; margin: 6px 0 10px; }
#detail dl { display: grid; grid-template-columns: 80px 1fr; gap: 4px 8px; margin: 0; }
#detail dt { color: var(--muted); } #detail dd { margin: 0; word-break: break-word; }
.x { float: right; border: 0; background: var(--track); border-radius: 999px; width: 28px; height: 28px; cursor: pointer; font-size: 14px; }
.lnk { cursor: pointer; color: var(--lavender); }
@media (max-width: 600px) { main { padding: 10px; } .filters select, .filters input { max-width: 130px; } }
</style>
</head>
<body>
<header>
  <h1><span class="live" id="live" title="live updates"></span>UniKey project tracker <span class="sub" id="sum"></span></h1>
  <nav id="tabs">
    <button data-v="overview">Overview</button><button data-v="kanban">Kanban</button>
    <button data-v="graph">Graph</button><button data-v="gantt">Gantt</button>
  </nav>
  <div class="filters">
    <select id="fProj"></select><select id="fOwner"></select><select id="fTag"></select>
    <select id="fPri"><option value="">any priority</option><option>0</option><option>1</option><option>2</option><option>3</option></select>
    <select id="fSt"><option value="">open</option><option value="all">all statuses</option></select>
    <input id="fQ" type="search" placeholder="Search">
    <label class="kb">group <select id="fGroup"><option value="project">project</option><option value="">none</option><option value="owner">owner</option><option value="pri">priority</option><option value="tag">tag</option><option value="kind">kind</option><option value="group">group</option></select></label>
    <label class="kb">levels <select id="fLevel"><option value="top">tasks + bugs</option><option value="all">all levels</option></select></label>
  </div>
</header>
<main>
  <section class="view" id="v-overview"></section>
  <section class="view" id="v-kanban"></section>
  <section class="view" id="v-graph"><div id="graphWrap"><canvas id="graph"></canvas>
    <div class="legend"><i style="border-color:#B4BAD3"></i>parent<i style="border-color:#C4693F"></i>depends on<i style="border-color:#7569D6;border-top-style:dashed"></i>relates<i style="border-color:#8C90AE;border-top-style:dotted"></i>doc ref</div></div></section>
  <section class="view" id="v-gantt"><div id="gantt"></div></section>
</main>
<aside id="detail"></aside>
<div id="tip"></div>
<script>
"use strict";
const ST = { td: "To do", ip: "In progress", bl: "Blocked", oh: "On hold", dn: "Done", dr: "Dropped" };
const KIND = { P: "project", T: "task", S: "subtask", D: "todo", B: "bug", M: "milestone" };
const COLOR = { td: "#B4BAD3", ip: "#F6C453", bl: "#C4693F", oh: "#8C90AE", dn: "#23694D", dr: "#D9D9D9" };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

let D = { items: [], log: [], today: "" }, by = new Map(), kids = new Map();
let view = (location.hash.slice(1) || store.get("pm.view") || "overview");

const F = {};
["fProj", "fOwner", "fTag", "fPri", "fSt", "fQ", "fGroup", "fLevel"].forEach((id) => {
  const el = $("#" + id);
  F[id] = el;
  const saved = store.get("pm." + id);
  if (saved !== null) el.dataset.saved = saved;
  el.addEventListener("input", () => { store.set("pm." + id, el.value); render(); });
});

function ancestors(it) { const out = []; let p = by.get(it.parent); while (p && !out.includes(p)) { out.push(p); p = by.get(p.parent); } return out; }
function nearestProject(it) { return it.kind === "P" ? it : ancestors(it).find((a) => a.kind === "P"); }
function under(id) { const out = []; const walk = (p) => (kids.get(p) || []).forEach((k) => { out.push(k); walk(k.id); }); walk(id); return out; }
const isOpen = (i) => i.st !== "dn" && i.st !== "dr";
const work = (i) => i.kind !== "P" && i.kind !== "M";
const projName = (p) => p ? p.title : "(no project)";
function crumb(it) { const a = ancestors(it).reverse(); return (a.length > 1 ? a.slice(1) : a).map((x) => x.title).join(" › "); }
function dshort(d) { return d ? d.slice(5) : ""; }
function daysBetween(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 864e5); }

function setOptions(sel, opts, label) {
  const keep = sel.value || sel.dataset.saved || "";
  sel.innerHTML = `<option value="">${label}</option>` + opts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join("");
  sel.value = opts.some(([v]) => v === keep) ? keep : "";
  delete sel.dataset.saved;
}

function filtered({ keepDone = false, kinds = null } = {}) {
  const proj = F.fProj.value, owner = F.fOwner.value, tag = F.fTag.value, pri = F.fPri.value, st = F.fSt.value;
  const q = F.fQ.value.trim().toLowerCase();
  const scope = proj ? new Set([proj, ...under(proj).map((i) => i.id)]) : null;
  return D.items.filter((i) => {
    if (kinds && !kinds.includes(i.kind)) return false;
    if (scope && !scope.has(i.id)) return false;
    if (owner && i.owner !== owner) return false;
    if (tag && !i.tags.includes(tag)) return false;
    if (pri && String(i.pri ?? 2) !== pri) return false;
    if (st && st !== "all" && i.st !== st) return false;
    if (!st && !keepDone && !isOpen(i)) return false;
    if (q && !(i.id + " " + i.title + " " + i.tags.join(" ") + " " + (i.owner || "")).toLowerCase().includes(q)) return false;
    return true;
  });
}

async function load() {
  const r = await fetch("/data", { cache: "no-store" });
  D = await r.json();
  by = new Map(D.items.map((i) => [i.id, i]));
  kids = new Map();
  for (const i of D.items) if (i.parent) { if (!kids.has(i.parent)) kids.set(i.parent, []); kids.get(i.parent).push(i); }
  const projs = D.items.filter((i) => i.kind === "P").map((p) => [p.id, (p.parent ? "  · " : "") + p.title]);
  setOptions(F.fProj, projs, "all projects");
  setOptions(F.fOwner, [...new Set(D.items.map((i) => i.owner).filter(Boolean))].sort().map((o) => [o, "@" + o]), "any owner");
  setOptions(F.fTag, [...new Set(D.items.flatMap((i) => i.tags))].sort().map((t) => [t, "#" + t]), "any tag");
  const s = F.fSt.value || F.fSt.dataset.saved || "";
  F.fSt.innerHTML = `<option value="">open</option><option value="all">all statuses</option>` + Object.entries(ST).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  F.fSt.value = s; delete F.fSt.dataset.saved;
  for (const k of ["fPri", "fGroup", "fLevel"]) if (F[k].dataset.saved !== undefined) { F[k].value = F[k].dataset.saved; delete F[k].dataset.saved; }
  const open = D.items.filter((i) => work(i) && isOpen(i)).length;
  $("#sum").textContent = `· ${D.items.length} items · ${open} open · updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
  render();
  if (detailId) showDetail(detailId);
}

function render() {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.v === view));
  document.querySelectorAll(".view").forEach((v) => v.classList.toggle("on", v.id === "v-" + view));
  document.querySelectorAll(".kb").forEach((e) => (e.style.display = view === "kanban" ? "" : "none"));
  ({ overview: renderOverview, kanban: renderKanban, graph: renderGraph, gantt: renderGantt })[view]();
}
$("#tabs").addEventListener("click", (e) => { const v = e.target.dataset.v; if (v) { view = v; location.hash = v; store.set("pm.view", v); render(); } });

function liRow(i, extra = "") {
  return `<div class="li" data-id="${i.id}"><span class="st st-${i.st}"></span><span class="id">${i.id}</span>
    <span class="t">${esc(i.title)} <span class="muted small">${esc(crumb(i))}</span></span>${extra}</div>`;
}

// ---------- overview ----------
function renderOverview() {
  const all = filtered({ keepDone: true });
  const w = all.filter(work);
  const open = w.filter(isOpen);
  const weekAgo = new Date(Date.parse(D.today) - 7 * 864e5).toISOString().slice(0, 10);
  const doneWeek = w.filter((i) => i.st === "dn" && i.done && i.done > weekAgo).length;
  const ms = D.items.filter((i) => i.kind === "M" && isOpen(i) && i.due).sort((a, b) => a.due.localeCompare(b.due))[0];
  const k = (n, l, c = "") => `<div class="card kpi"><b style="color:${c}">${n}</b><span class="muted">${l}</span></div>`;
  let h = `<div class="kpis">${k(open.length, "open work items")}${k(open.filter((i) => i.st === "ip").length, "in progress", "#D49A1E")}
    ${k(open.filter((i) => i.blocked).length, "blocked", "#C4693F")}${k(open.filter((i) => i.overdue).length, "overdue", "#C4693F")}
    ${k(doneWeek, "done in 7 days", "#23694D")}${ms ? k(daysBetween(D.today, ms.due) + "d", "to " + esc(ms.title)) : ""}</div>`;
  const projs = D.items.filter((p) => p.kind === "P" && (!F.fProj.value || p.id === F.fProj.value || ancestors(p).some((a) => a.id === F.fProj.value)));
  h += `<div class="grid">` + projs.filter((p) => p.parent || projs.length === 1).map((p) => {
    const sub = under(p.id).filter(work), [dn, n] = p.progress;
    const pct = n ? Math.round((100 * dn) / n) : 0;
    const c = (s) => sub.filter((i) => i.st === s).length;
    const nd = sub.filter((i) => isOpen(i) && i.due).sort((a, b) => a.due.localeCompare(b.due))[0];
    return `<div class="card proj" data-proj="${p.id}"><h3><span class="st st-${p.st}"></span>${esc(p.title)} <span class="id">${p.id}</span></h3>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="muted small" style="margin-top:6px">${pct}% · ${dn}/${n} done · ${c("ip")} in progress · ${c("bl") + sub.filter((i) => i.blocked && i.st !== "bl").length} blocked · ${c("oh")} on hold
      ${nd ? `<br>next due <span class="${nd.overdue ? "late" : ""}">${dshort(nd.due)}</span> ${esc(nd.title)}` : ""}${p.owner ? ` · @${esc(p.owner)}` : ""}</div></div>`;
  }).join("") + `</div>`;
  const sec = (title, items, extra) => `<div class="panel"><h2>${title} <span class="muted">${items.length}</span></h2>${items.slice(0, 40).map((i) => liRow(i, extra(i))).join("") || '<span class="muted">none</span>'}</div>`;
  const byDue = (a, b) => (a.due || "9").localeCompare(b.due || "9");
  const soon = new Date(Date.parse(D.today) + 14 * 864e5).toISOString().slice(0, 10);
  h += `<div class="cols2">
    ${sec("Blocked", open.filter((i) => i.blocked), (i) => `<span class="small late">${i.openDeps.length ? "waits " + i.openDeps.join(",") : "blocked"}</span>`)}
    ${sec("Waiting on a dependency (P0-P1)", open.filter((i) => i.waiting && (i.pri ?? 2) <= 1), (i) => `<span class="small muted">waits ${i.openDeps.join(",")}</span>`)}
    ${sec("Overdue", open.filter((i) => i.overdue).sort(byDue), (i) => `<span class="small late">${dshort(i.due)}</span>`)}
    ${sec("Due in 14 days", open.filter((i) => i.due && !i.overdue && i.due <= soon).sort(byDue), (i) => `<span class="small">${dshort(i.due)}</span>`)}
    ${sec("In progress", open.filter((i) => i.st === "ip"), (i) => `<span class="small muted">${i.owner ? "@" + esc(i.owner) : ""}</span>`)}
    <div class="panel"><h2>Progress over time</h2>${burnup(w)}</div>
    <div class="panel"><h2>Recent activity</h2>${D.log.slice(-30).reverse().map((l) => {
      const i = by.get(l.id);
      return `<div class="li" data-id="${esc(l.id)}"><span class="small muted" style="width:82px;flex:none">${esc(l.ts.slice(5).replace("T", " "))}</span>
        <span class="id">${esc(l.id)}</span><span class="t">${esc(l.ch.startsWith("+") ? "created" : l.ch)} <span class="muted">${esc(i ? i.title : "")}</span></span><span class="small muted">${esc(l.by)}</span></div>`;
    }).join("")}</div></div>`;
  $("#v-overview").innerHTML = h;
}

function burnup(w) {
  // cumulative created vs done per day, from the log (created) and item done dates
  const ids = new Set(w.map((i) => i.id));
  const created = new Map();
  for (const l of D.log) if (ids.has(l.id) && l.ch.startsWith("+") && !created.has(l.id)) created.set(l.id, l.ts.slice(0, 10));
  const days = [...new Set([...created.values(), ...w.filter((i) => i.done).map((i) => i.done), D.today])].sort();
  if (days.length < 2) return '<span class="muted">not enough history yet</span>';
  const start = days[0], n = daysBetween(start, D.today) + 1;
  const tot = [], dn = [];
  for (let d = 0; d < n; d++) {
    const day = new Date(Date.parse(start) + d * 864e5).toISOString().slice(0, 10);
    tot.push(w.filter((i) => (created.get(i.id) || start) <= day && i.st !== "dr").length);
    dn.push(w.filter((i) => i.st === "dn" && i.done && i.done <= day).length);
  }
  const W = 560, H = 150, max = Math.max(...tot, 1);
  const pt = (arr) => arr.map((v, i) => `${(i / Math.max(n - 1, 1)) * (W - 30) + 25},${H - 18 - (v / max) * (H - 30)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Created and done items over time">
    <line x1="25" y1="${H - 18}" x2="${W - 5}" y2="${H - 18}" stroke="#D8DFEF"/>
    <polyline points="${pt(tot)}" fill="none" stroke="#B4BAD3" stroke-width="2"/>
    <polyline points="${pt(dn)}" fill="none" stroke="#23694D" stroke-width="2.5"/>
    <text x="25" y="${H - 4}" font-size="10" fill="#555A80">${start}</text><text x="${W - 5}" y="${H - 4}" font-size="10" fill="#555A80" text-anchor="end">${D.today}</text>
    <text x="28" y="12" font-size="10" fill="#555A80">— total ${tot[tot.length - 1]}</text><text x="120" y="12" font-size="10" fill="#23694D">— done ${dn[dn.length - 1]}</text></svg>`;
}

// ---------- kanban ----------
function renderKanban() {
  const level = F.fLevel.value || "top";
  const st = F.fSt.value;
  let items = filtered({ keepDone: true, kinds: level === "top" ? ["T", "B"] : ["T", "S", "D", "B"] });
  if (!st) items = items.filter((i) => i.st !== "dr");
  const cols = st && st !== "all" ? [st] : ["td", "ip", "bl", "oh", "dn"].concat(st === "all" ? ["dr"] : []);
  const g = F.fGroup.value;
  const key = (i) => g === "project" ? [projName(nearestProject(i))] : g === "owner" ? ["@" + (i.owner || "unassigned")]
    : g === "pri" ? ["p" + (i.pri ?? 2)] : g === "tag" ? (i.tags.length ? i.tags.map((t) => "#" + t) : ["(no tag)"])
    : g === "kind" ? [KIND[i.kind]] : g === "group" ? [i.group || "(no group)"] : ["All"];
  const lanes = new Map();
  for (const i of items) for (const k of key(i)) { if (!lanes.has(k)) lanes.set(k, []); lanes.get(k).push(i); }
  const sorted = [...lanes.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  const sortI = (a, b) => (a.pri ?? 2) - (b.pri ?? 2) || (a.due || "9").localeCompare(b.due || "9") || a.id.localeCompare(b.id, undefined, { numeric: true });

  const es = new EventSource("/events");
  es.onopen = () => $("#live").classList.add("on");
  es.onmessage = () => load();
  es.onerror = () => $("#live").classList.remove("on");
}
load().then(connect);
</script>
</body>
</html>
